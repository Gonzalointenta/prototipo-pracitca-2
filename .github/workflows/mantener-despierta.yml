name: Despertar la web (mañana y mediodía, L a V)

on:
  schedule:
    - cron: "0 9 * * 1-5"
    - cron: "0 15 * * 1-5"
  workflow_dispatch: {}

jobs:
  despertar:
    runs-on: ubuntu-latest
    steps:
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Playwright + Chromium
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Despertar la web
        run: |
          python - <<'PY'
          import os, re
          from playwright.sync_api import sync_playwright
          URL = os.environ.get("STREAMLIT_APP_URL", "https://insumos-mt26.streamlit.app").strip()
          print("Despertando:", URL)
          with sync_playwright() as p:
              navegador = p.chromium.launch()
              pagina = navegador.new_page()
              pagina.goto(URL, wait_until="load", timeout=60000)
              try:
                  print("Estado inicial:", (pagina.inner_text("body") or "").replace("\n", " ")[:120])
              except Exception:
                  pass
              desperto = False
              try:
                  pagina.get_by_role("button", name=re.compile(r"back up", re.IGNORECASE)).first.click(timeout=25000)
                  print("Boton de despertar CLICKEADO.")
                  desperto = True
              except Exception as e:
                  print("(no habia boton de despertar; ya estaba despierta o no aparecio:", str(e)[:80], ")")
              pagina.wait_for_timeout(90000 if desperto else 15000)
              try:
                  print("Estado final:", (pagina.inner_text("body") or "").replace("\n", " ")[:120])
              except Exception:
                  pass
              navegador.close()
          print("Listo.")
          PY
